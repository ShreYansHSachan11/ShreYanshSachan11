<text x="88" y="152" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">On </text><text x="226.4" y="152" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">, </text><text x="356.4" y="152" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82"> reported a</text><text x="88" y="179" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">stolen phone near </text><text x="394.4" y="179" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">.</text><text x="88" y="206" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">Reach him on </text><text x="293.6" y="206" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">.</text><text x="88" y="233" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">Witness </text><text x="243.2" y="233" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82"> saw a scooter,</text><text x="88" y="260" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">plate </text><text x="251.6" y="260" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">, seen at </text><text x="381.6" y="260" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">.</text><text x="88" y="287" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">Recorded by </text><text x="310.4" y="287" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">, badge </text><text x="432" y="287" class="m" font-size="14" xml:space="preserve" fill="#12161f" fill-opacity=".82">.</text>
