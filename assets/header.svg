<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title">
<title id="title">Shreyansh Sachan — Code meets curiosity. Frontend developer at Pinntag.</title>
<style>
.d{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
.s{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.q{font-family:Georgia,'Times New Roman',serif}
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s .3s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.marquee{animation:marquee 46s linear infinite}
@keyframes marquee{to{transform:translateX(-2208px)}}
.float-a{animation:float 6s ease-in-out infinite}
.float-b{animation:float 7s -2s ease-in-out infinite}
.float-c{animation:float 8s -4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flow{stroke-dashoffset:0}.rise{opacity:1}}</style>
<defs>
<clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12161f" flood-opacity=".22"/></filter>
<filter id="lift" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12161f" flood-opacity=".18"/></filter>

<radialGradient id="sphere" cx=".34" cy=".3" r=".8"><stop offset="0" stop-color="#f8ae76"/><stop offset=".5" stop-color="#f3562e"/><stop offset="1" stop-color="#ad3e69"/></radialGradient>
<radialGradient id="pinkball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#faa6ce"/><stop offset="1" stop-color="#faa6ce"/></radialGradient>
<pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#12161f" fill-opacity=".07"/></pattern>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="400" fill="#faf6ee"/>
<rect width="1200" height="400" fill="url(#grain)"/>
<path class="flow" pathLength="1" d="M1180 -20C1000 90 1140 230 905 300S560 300 470 430" fill="none" stroke="#faa6ce" stroke-width="3" stroke-linecap="round"/>

<g class="rise">
  <circle cx="70" cy="86" r="5" fill="#f3562e"/>
  <text x="84" y="91" class="t" font-size="14" font-weight="700" letter-spacing="2" fill="#12161f">FRONTEND DEVELOPER @ PINNTAG</text>
  <text x="62" y="176" class="d" font-size="80" fill="#12161f">Shreyansh<tspan fill="#f3562e">.</tspan></text>
  <text x="64" y="246" class="s" font-size="70" fill="#1f5ed9">Code meets</text>
  <text x="62" y="316" class="d" font-size="68" fill="#12161f">curiosity.</text>
</g>

<g transform="translate(900 172)"><g class="float-a">
  <g transform="rotate(-16)"><ellipse rx="160" ry="54" fill="none" stroke="#24479d" stroke-width="28"/></g>
  <circle r="96" fill="url(#sphere)"/>
  <ellipse cx="-30" cy="-38" rx="26" ry="16" fill="#fff" fill-opacity=".28" transform="rotate(-30 -30 -38)"/>
  <g transform="rotate(-16)">
    <path d="M-160 0A160 54 0 0 0 160 0" fill="none" stroke="#1f5ed9" stroke-width="28" stroke-linecap="round"/>
    <path d="M-148 10A150 46 0 0 0 148 10" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
  </g>
</g></g>
<g transform="translate(712 282)"><g class="float-b"><g class="spin">
  <rect x="-30" y="-30" width="60" height="60" rx="11" fill="#c4f16a"/>
  <path d="M-30 14L30 14L30 19Q30 30 19 30L-19 30Q-30 30 -30 19Z" fill="#00de9b"/>
</g></g></g>
<g transform="translate(1040 76)"><g class="float-c"><circle r="20" fill="url(#pinkball)"/></g></g>
<g transform="translate(1062 292)"><g class="float-a">
  <circle r="25" fill="none" stroke="#f0ebe0" stroke-width="15"/>
  <circle r="25" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-dasharray="30 200"/>
</g></g>

