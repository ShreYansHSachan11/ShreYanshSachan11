<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title">
<title id="title">Guardian — live relief updates pulse out while each donation drops onto an open, traceable ledger.</title>
<style>
