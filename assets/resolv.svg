<radialGradient id="rvglow"><stop offset="0" stop-color="#c4f16a" stop-opacity=".22"/><stop offset="1" stop-color="#c4f16a" stop-opacity="0"/></radialGradient>
<filter id="deep" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="380" fill="#0b0d12"/>
<rect width="600" height="380" fill="url(#rvgrid)"/>
