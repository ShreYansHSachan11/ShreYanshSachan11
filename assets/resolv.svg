  <text x="444.6" y="105" text-anchor="middle" class="t" font-size="10.5" font-weight="700" fill="#0b0d12">Assigned</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/>
  <rect x="380.8" y="91" width="101.2" height="20" rx="10" fill="#c4f16a"/>
