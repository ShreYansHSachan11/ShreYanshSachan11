<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title">
<title id="title">Resolv — one incident moves through the triage, acknowledgement, pending and resolution agents, filling in its audit trail.</title>
<style>
.d{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
.s{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.q{font-family:Georgia,'Times New Roman',serif}
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
