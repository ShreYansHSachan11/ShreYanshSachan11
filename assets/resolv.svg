  <text x="118" y="210" class="t" font-size="11" font-weight="700" fill="#c4f16a">Triage<animate attributeName="fill" values="#c4f16a;#f9f6f1;#f9f6f1;#f9f6f1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="210" class="t" font-size="11" fill="#f9f6f1" opacity="1">Network Ops · on-shift engineer<animate attributeName="opacity" values="1;1;1;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
