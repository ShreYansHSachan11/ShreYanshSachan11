  <text x="206" y="231" class="t" font-size="11" fill="#f9f6f1" opacity="0">Caller acknowledged · ACK-02<animate attributeName="opacity" values="0;1;1;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="231" class="t" font-size="11" fill="#f9f6f1" opacity="1">waiting<animate attributeName="opacity" values="1;0;0;0" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
