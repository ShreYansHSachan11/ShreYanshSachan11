  <text x="118" y="252" class="t" font-size="11" font-weight="700" fill="#f9f6f1">Pending<animate attributeName="fill" values="#f9f6f1;#f9f6f1;#c4f16a;#f9f6f1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="252" class="t" font-size="11" fill="#f9f6f1" opacity="0">Reminder scheduled in 4h<animate attributeName="opacity" values="0;0;1;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="252" class="t" font-size="11" fill="#f9f6f1" opacity="1">waiting<animate attributeName="opacity" values="1;1;0;0" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="482" y="252" text-anchor="end" class="m" font-size="10.5" fill="#f9f6f1" fill-opacity=".55" opacity="0">+1h 12m<animate attributeName="opacity" values="0;0;1;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text></g><g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;0.28;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/>
  <text x="118" y="273" class="t" font-size="11" font-weight="700" fill="#f9f6f1">Resolution<animate attributeName="fill" values="#f9f6f1;#f9f6f1;#f9f6f1;#c4f16a" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="273" class="t" font-size="11" fill="#f9f6f1" opacity="0">Caller confirmed · auto-resolved<animate attributeName="opacity" values="0;0;0;1" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
  <text x="206" y="273" class="t" font-size="11" fill="#f9f6f1" opacity="1">waiting<animate attributeName="opacity" values="1;1;1;0" dur="8.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75"/></text>
